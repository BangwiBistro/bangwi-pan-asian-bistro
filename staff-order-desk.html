<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Order Desk | Bang'wi</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f7f2e8;color:#202820;font:15px Arial}header{background:#1d2922;color:white;padding:22px;text-align:center}h1{font:32px Georgia;color:#f4d7a0;margin:0}.wrap{max-width:1100px;margin:auto;padding:22px}.panel,.order{background:#fffaf2;border:1px solid #e5d7bf;padding:18px;margin:14px 0}input{padding:12px;border:1px solid #ccc;width:100%;max-width:360px}button{padding:10px 14px;border:0;background:#9b3528;color:white;cursor:pointer;margin:5px 4px 5px 0}.order h3{margin:0 0 8px}.muted{color:#687269;font-size:13px}.hidden{display:none}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;background:#eee4d2;padding:5px 9px;margin:3px}</style></head><body><header><h1>Bang'wi · Staff Order Desk</h1><p>Kitchen & service dashboard</p></header><main class="wrap"><section class="panel" id="login"><h2>Staff login</h2><input id="email" type="email" placeholder="Staff email"><br><br><input id="password" type="password" placeholder="Password"><br><br><button id="sign">Sign in</button><p id="msg" class="muted"></p></section><section id="desk" class="hidden"><div class="row"><h2>Live orders</h2><button id="refresh">Refresh orders</button><button id="out">Sign out</button></div><p class="muted">Update the status as the kitchen prepares each order. If live updates are not enabled in Supabase, use Refresh orders.</p><div id="orders"></div></section></main><script>
const db=window.supabase.createClient("https://rnxisgenoencbqhuspwp.supabase.co","sb_publishable_wyeTmgx73cJuFBoHnjmiYQ_r4ShNiNO");const msg=document.getElementById("msg");
document.getElementById("sign").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});msg.textContent=error?error.message:"Signed in.";if(!error){document.getElementById("login").classList.add("hidden");document.getElementById("desk").classList.remove("hidden");load()}};
document.getElementById("out").onclick=async()=>{await db.auth.signOut();location.reload()};document.getElementById("refresh").onclick=load;
async function load(){const root=document.getElementById("orders");root.textContent="Loading…";const {data,error}=await db.from("orders").select("id,order_number,customer_name,customer_phone,table_code,order_type,payment_method,status,total_amount,created_at,order_items(item_name,quantity,unit_price,line_total)").order("created_at",{ascending:false}).limit(80);if(error){root.textContent="Could not load orders: "+error.message;return}root.innerHTML="";for(const o of data||[]){const card=document.createElement("article");card.className="order";const h=document.createElement("h3");h.textContent="#"+o.order_number+" · "+(o.customer_name||"Customer");const info=document.createElement("p");info.textContent=(o.order_type||"")+" · "+(o.table_code||"") +" · "+(o.customer_phone||"")+" · ₹"+o.total_amount;const items=document.createElement("p");items.textContent=(o.order_items||[]).map(i=>i.item_name+" × "+i.quantity).join(" | ");const status=document.createElement("p");status.innerHTML='<b>Status: </b>';const badge=document.createElement("span");badge.className="pill";badge.textContent=o.status;status.append(badge);const controls=document.createElement("div");controls.className="row";for(const s of ["accepted","preparing","ready","completed"]){const b=document.createElement("button");b.textContent=s[0].toUpperCase()+s.slice(1);b.onclick=async()=>{const {error}=await db.from("orders").update({status:s}).eq("id",o.id);if(error)alert(error.message);else load()};controls.append(b)}const wa=document.createElement("button");wa.textContent="Share bill on WhatsApp";wa.onclick=()=>{const text="Bang'wi Pan Asian Bistro%0AOrder #"+encodeURIComponent(o.order_number)+"%0A"+encodeURIComponent(items.textContent)+"%0ATotal: ₹"+encodeURIComponent(o.total_amount);window.open("https://wa.me/"+String(o.customer_phone||"").replace(/\D/g,"")+"?text="+text,"_blank")};controls.append(wa);card.append(h,info,items,status,controls);root.append(card)}if(!data?.length)root.textContent="No orders yet."}
</script></body></html>
