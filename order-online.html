<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Online | Bang'wi Pan Asian Bistro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#1d2922;--cream:#f7f2e8;--gold:#c79b55;--red:#9b3528}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#202820;font:15px Arial}header{background:var(--green);color:white;padding:24px;text-align:center}header h1{font:38px Georgia;margin:0;color:#f4d7a0}header p{margin:8px 0 0;color:#e7e0d4}.wrap{max-width:1050px;margin:auto;padding:24px}.panel{background:#fffaf2;padding:22px;border:1px solid #e5d7bf;margin-bottom:18px}label{display:block;font-weight:bold;font-size:13px;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d8cdbb;background:white;font-size:15px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.item{background:white;border:1px solid #e5d7bf;padding:15px}.item strong{display:block;margin-bottom:6px}.item small{color:#687269}.itemline{display:flex;justify-content:space-between;align-items:center;gap:10px}.qty{width:72px}.btn{background:var(--red);color:white;border:0;padding:13px 20px;font-weight:bold;cursor:pointer}.btn:disabled{opacity:.5}.gold{background:var(--gold);color:#201a12}.muted{color:#687269;font-size:13px}.cartrow{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}.total{font-size:21px;font-weight:bold;text-align:right;margin:14px 0}.status{padding:12px;background:#f1eadc;margin-top:12px;white-space:pre-wrap}.hidden{display:none}@media(max-width:600px){.fields{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body>
<header><h1>Bang'wi</h1><p>PAN ASIAN BISTRO · ORDER ONLINE</p></header>
<main class="wrap">
<section class="panel"><h2>Your details</h2><div class="fields">
<div><label for="cust">Customer name</label><input id="cust" autocomplete="name" required></div>
<div><label for="phone">Mobile number</label><input id="phone" inputmode="tel" autocomplete="tel" required></div>
<div><label for="kind">Order type</label><select id="kind"><option value="dine_in">Dine in</option><option value="takeaway">Takeaway</option><option value="delivery">Delivery (confirm by phone)</option></select></div>
<div id="tableWrap"><label for="table">Table number (if dining in)</label><select id="table"><option value="">Choose table</option><option value="T01">Table 1</option><option value="T02">Table 2</option><option value="T03">Table 3</option><option value="T04">Table 4</option><option value="T05">Table 5</option><option value="T06">Table 6</option><option value="T07">Table 7</option><option value="T08">Table 8</option><option value="T09">Table 9</option><option value="T10">Table 10</option><option value="T11">Table 11</option><option value="T12">Table 12</option><option value="T13">Table 13</option><option value="T14">Table 14</option><option value="T15">Table 15</option></select></div>
<div><label for="pay">Payment method</label><select id="pay"><option value="pay_at_restaurant">Pay at restaurant (cash / UPI)</option><option value="online">Online payment (payment link to be confirmed)</option></select></div>
</div><p class="muted">No OTP required. Please enter a reachable mobile number so our team can confirm your order.</p></section>
<section class="panel"><h2>Our menu</h2><p class="muted" id="loadmsg">Loading available dishes…</p><div id="menu" class="menu"></div></section>
<section class="panel"><h2>Your order</h2><div id="cart"><p class="muted">Add dishes from the menu.</p></div><div class="total" id="total">Total: ₹0</div><button id="place" class="btn" disabled>Place order</button><div id="result" class="status hidden"></div></section>
</main>
<script>
const SUPABASE_URL="https://rnxisgenoencbqhuspwp.supabase.co";
const SUPABASE_KEY="sb_publishable_wyeTmgx73cJuFBoHnjmiYQ_r4ShNiNO";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let dishes=[],cart=new Map();
const money=n=>"₹"+Number(n).toFixed(0);
function showCart(){let el=document.getElementById("cart"),total=0;el.innerHTML="";for(const [id,q] of cart){const d=dishes.find(x=>x.id===id);if(!d)continue;total+=Number(d.price)*q;const row=document.createElement("div");row.className="cartrow";row.textContent=d.name+" × "+q+" — "+money(d.price*q);el.append(row)}if(!cart.size)el.innerHTML='<p class="muted">Add dishes from the menu.</p>';document.getElementById("total").textContent="Total: "+money(total);document.getElementById("place").disabled=!cart.size}
function render(){const root=document.getElementById("menu");root.innerHTML="";for(const d of dishes){const card=document.createElement("article");card.className="item";const line=document.createElement("div");line.className="itemline";const left=document.createElement("div");const name=document.createElement("strong");name.textContent=d.name;const desc=document.createElement("small");desc.textContent=d.description||d.category||"";left.append(name,desc);const right=document.createElement("div");right.className="itemline";const price=document.createElement("b");price.textContent=money(d.price);const qty=document.createElement("input");qty.className="qty";qty.type="number";qty.min="0";qty.max="20";qty.value=cart.get(d.id)||0;qty.setAttribute("aria-label","Quantity for "+d.name);qty.addEventListener("change",()=>{const n=Math.max(0,Math.min(20,Number(qty.value)||0));if(n)cart.set(d.id,n);else cart.delete(d.id);showCart()});right.append(price,qty);line.append(left,right);card.append(line);root.append(card)}}
async function load(){const {data,error}=await db.from("menu_items").select("id,name,description,category,price").eq("is_active",true).eq("is_available",true).order("category").order("name");if(error){document.getElementById("loadmsg").textContent="Menu could not load: "+error.message;return}dishes=data||[];document.getElementById("loadmsg").textContent=dishes.length?dishes.length+" dishes available. Enter quantity beside each dish.":"No dishes are currently marked available.";render()}
document.getElementById("kind").addEventListener("change",e=>document.getElementById("tableWrap").classList.toggle("hidden",e.target.value!=="dine_in"));
document.getElementById("place").addEventListener("click",async()=>{const name=document.getElementById("cust").value.trim(),phone=document.getElementById("phone").value.replace(/\D/g,""),kind=document.getElementById("kind").value,table=document.getElementById("table").value,payment=document.getElementById("pay").value;const result=document.getElementById("result");if(name.length<2||phone.length<10){alert("Please enter your name and a valid mobile number.");return}if(kind==="dine_in"&&!table){alert("Please select your table number.");return}const items=[...cart].map(([menu_item_id,quantity])=>({menu_item_id,quantity}));const payload={customer_name:name,customer_phone:phone,order_type:kind,payment_method:payment,table_code:kind==="dine_in"?table:null,items};const button=document.getElementById("place");button.disabled=true;button.textContent="Sending order…";const {data,error}=await db.rpc("place_customer_order",{payload});button.textContent="Place order";button.disabled=false;result.classList.remove("hidden");if(error){result.textContent="Order was not submitted. "+error.message;return}const response=Array.isArray(data)?data[0]:data;const orderNo=response?.order_number||"received";const tracking=response?.tracking_code;result.textContent="Thank you! Your order number is "+orderNo+". Please keep this page open or save your tracking code: "+(tracking||"not returned")+". Our team will confirm your order. Online payment is not charged through this page.";cart.clear();showCart()});
load();
</script></body></html>
